spring.application.name=goldproject

# Port 8080 falls inside a Windows-reserved excluded port range on this machine (an
# OS/Hyper-V dynamic port exclusion, not an app conflict), so it can't always be bound.
server.port=8090

# ==========================================
# Neon Database Connection Settings
# ==========================================
spring.datasource.url=jdbc:postgresql://ep-shy-brook-aj625s9w-pooler.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_RPMokfbOt2F8
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Spring Data JPA / Hibernate Settings
# ==========================================
# Dialect is usually auto-detected, but explicitly setting it is good practice
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate DDL Auto (update for dev, change to 'validate' or 'none' for production)
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Chart data cache (dashboard chart endpoints) — 24h TTL, cleared on demand via
# ChartService.clearChartCache() when the user presses "Refresh Now"
# ==========================================
spring.cache.type=caffeine
spring.cache.cache-names=chartData
spring.cache.caffeine.spec=expireAfterWrite=24h,maximumSize=500

